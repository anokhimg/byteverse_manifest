  - alias: Contract_Details_1
    isDynamic: true
    path: dbfs:/mnt/data/contracts/part-00000-ad234a4d-e1f0-4955-b2b7-60fa3b0961d9-c000.snappy.parquet
    optional:
      persistDataFrame: false
      advanceOptions:
        mergeSchema: true
      enableDataReconciliation: false
      enforceSchema: false
      connection: Content Details
      dataSetUrn: urn:dv:dataset:96f2eb33-b308-405c-880f-a0342dda6a61
    type: inputParquet
productState:
  isDynamic: true
  alias: Load_all_rights_data_into_delta
  retentionVersions: ""
  logicalSchema:
    properties:
      ContentID:
        type: STRING
        description: Unique identifier for the content
        sourceColumn: ContentID
        sourceTable: Rightsline
      ContentType:
        type: STRING
        description: Type of content (e.g., movie, series, documentary)
        sourceColumn: ContentType
        sourceTable: Rightsline
      Cost:
        type: STRING
        description: Cost associated with the content license
        sourceColumn: Cost
        sourceTable: Rightsline
      DistributionChannel:
        type: STRING
        description: Channel through which the content is distributed
        sourceColumn: DistributionChannel
        sourceTable: Rightsline
      Episodes:
        type: STRING
        description: Number of episodes in the season, if applicable
        sourceColumn: Episodes
        sourceTable: Rightsline
      Format:
        type: STRING
        description: Format of the content (e.g., HD, SD, 4K)
        sourceColumn: Format
        sourceTable: Rightsline
      Geography:
        type: STRING
        description: Geographical region where the content is licensed
        sourceColumn: Geography
        sourceTable: Rightsline
      LicencePeriodInDays:
        type: STRING
        description: Total duration of the license period in days
        sourceColumn: LicencePeriodInDays
        sourceTable: Rightsline
      LicenseEndDate:
        type: STRING
        description: End date of the content license
        sourceColumn: LicenseEndDate
        sourceTable: Rightsline
      LicenseStartDate:
        type: STRING
        description: Start date of the content license
        sourceColumn: LicenseStartDate
        sourceTable: Rightsline
      Platform:
        type: STRING
        description: Platform on which the content is available (e.g., Netflix, Hulu)
        sourceColumn: Platform
        sourceTable: Rightsline
      RightsHolder_ContentProvider:
        type: STRING
        description: Name of the rights holder or content provider
        sourceColumn: RightsHolder_ContentProvider
        sourceTable: Rightsline
      Season:
        type: STRING
        description: Season number of the content, if applicable
        sourceColumn: Season
        sourceTable: Rightsline
      Title:
        type: STRING
        description: Title of the content
        sourceColumn: Title
        sourceTable: Rightsline
  stateStoreType: writeDataFrameToDeltaTable
  isProfilingEnabled: true
  updateStrategy: Overwrite
  tableWritePath: dbfs:/mnt/data/delta_test/crdp_rights
  optional:
    persistDataFrame: false
    enableDataReconciliation: false
    enforceSchema: false
    loggingOptions:
      printSchema: true
      count: true
  refreshInterval: 0 6 * * *
transformation:
  - isDynamic: true
    alias: Spark_SQL_1
    description: Join content and contracts
    sequence: 3
    inputDataFrameList:
      - inputDataFrame: Content_Master_1
        tempViewName: content
      - inputDataFrame: Contract_Details_1
        tempViewName: contracts
    query: select c.*,t.title,t.contenttype from contracts c left join content t on
      c.contentid = t.contentid
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
  - isDynamic: true
    alias: Spark_SQL_2
    description: rename columns
    sequence: 4
    inputDataFrameList:
      - inputDataFrame: Spark_SQL_1
        tempViewName: content
    query: select c.ContentID AS contentid, c.Season AS season, c.Episode AS
      episode, c.Format AS format, c.RightsHolder_ContentProvider AS
      rightsholder_contentprovider, c.Platform AS platform, c.LicenseStartDate
      AS licensestartdate, c.LicenseEndDate AS licenseenddate,
      c.LicencePeriodDays AS licenceperioddays, c.Geography AS geography, c.Cost
      AS cost, c.DistributionChannel AS distributionchannel, c.title AS title,
      c.contenttype AS contenttype from content c;
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
    NullValueCheck:
      productState:
        checks:
          - column: Title
            expression: ==
            number: 1
        referenceAlias: Load_all_rights_data_into_delta
    UniquenessCheck:
      productState:
        checks:
          - column: ContentID
        referenceAlias: Load_all_rights_data_into_delta
