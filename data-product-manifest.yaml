jobId: "172"
jobName: Geaography
jobType: Source Aligned Data Product
developerId: 5fd4295c-4450-4bd6-af56-3570e9c19332
domain: supply_chain
alias: Load_Geography_table_
discoveryPort:
  name: Geaography
inputPorts:
  - alias: Region_1
    isDynamic: true
    path: s3://dataverse-supplychain/datasets/region/
    optional:
      persistDataFrame: false
      advanceOptions:
        mergeSchema: true
      enableDataReconciliation: false
      enforceSchema: false
      connection: Supply Chain Datasets
      dataSetUrn: urn:dv:dataset:ae2dd0da-b332-45fc-a2bc-5ceb85ea11c4
    type: inputParquet
  - alias: Nation_1
    isDynamic: true
    path: s3://dataverse-supplychain/datasets/nation/
    optional:
      persistDataFrame: false
      advanceOptions:
        mergeSchema: true
      enableDataReconciliation: false
      enforceSchema: false
      connection: Supply Chain Datasets
      dataSetUrn: urn:dv:dataset:acde7d70-efaf-4469-9e36-c9287b6d9f0e
    type: inputParquet
productState:
  isDynamic: true
  alias: Load_Geography_table_
  retentionVersions: ""
  logicalSchema:
    properties:
      nation_key:
        type: STRING
        description: Unique identifier for each nation
        sourceColumn: N_NationKey
        sourceTable: df_nation
      nation_name:
        type: STRING
        description: Name of the nation
        sourceColumn: N_NAME
        sourceTable: df_nation
      region_key:
        type: STRING
        description: Foreign key linking nation to region
        sourceColumn: N_REGIONKEY
        sourceTable: df_nation
      nation_comment:
        type: STRING
        description: Additional comments about the nation
        sourceColumn: N_COMMENT
        sourceTable: df_nation
      region_name:
        type: STRING
        description: Name of the region
        sourceColumn: R_NAME
        sourceTable: df_region
      region_comment:
        type: STRING
        description: Additional comments about the region
        sourceColumn: R_COMMENT
        sourceTable: df_region
  stateStoreType: loadDataIceberg
  isProfilingEnabled: true
  updateStrategy: Overwrite
  tableName: s3source.geography
  warehousePath: s3://dataverse-supplychain/SADP/
  catalogName: iceberg
  optional:
    persistDataFrame: false
    enableDataReconciliation: false
    enforceSchema: true
    enforceSchemaMethod: Warning
    catalogType: glue
    loggingOptions:
      printSchema: true
  refreshInterval: None
transformation:
  - isDynamic: true
    alias: Spark_SQL_1
    description: Merge Region and Nation
    sequence: 3
    inputDataFrameList:
      - inputDataFrame: Region_1
        tempViewName: df_region
      - inputDataFrame: Nation_1
        tempViewName: df_nation
    query: SELECT n.N_NationKey AS nation_key, n.N_NAME AS nation_name,
      n.N_REGIONKEY AS region_key, n.N_COMMENT AS nation_comment, r.R_NAME AS
      region_name, r.R_COMMENT AS region_comment FROM df_nation n JOIN df_region
      r ON n.N_REGIONKEY = r.R_REGIONKEY;
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
    UniqueCombinationCheck:
      productState:
        checks:
          - columns:
              - nation_key
              - region_key
        referenceAlias: Load_Geography_table_
