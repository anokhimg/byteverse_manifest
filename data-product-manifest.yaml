transformation:
  - isDynamic: true
    alias: customer_geography
    description: Get Geography details
    sequence: 4
    inputDataFrameList:
      - inputDataFrame: Customer_1
        tempViewName: customer_df
      - inputDataFrame: Geography_1
        tempViewName: geo_df
    query: "select c.*, g.nation_name, g.region_name from customer_df c left join
      geo_df g on c.customer_nation = g.nation_key "
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
  - isDynamic: true
    alias: orders_agg
    description: Aggregate Order
    sequence: 5
    inputDataFrameList:
      - inputDataFrame: Orders_1
        tempViewName: orders_df
    query: select order_cust_key, count(distinct order_key) as total_orders,
      sum(order_total_price) as order_total_price, count(distinct case when
      order_status= 'P' then order_key end) as pending_orders, count(distinct
      case when order_status= 'F' then order_key end) as fulfilled_orders,
      count(distinct case when order_status= 'O' then order_key end) as
      open_orders , max(order_date) as last_order_date, min(order_date) as
      first_order_date from orders_df group by order_cust_key
    optional:
      persistDataFrame: false
      loggingOptions:
        showData: true
    type: operationThroughSqlQuery
  - isDynamic: true
    alias: Spark_SQL_3
    description: Combine Orders and Customer
    sequence: 6
    inputDataFrameList:
      - inputDataFrame: orders_agg
        tempViewName: orders_df
      - inputDataFrame: customer_geography
        tempViewName: customer_df
    query: select c.*, o.* from customer_df c left join orders_df o on
      c.customer_key = o.order_cust_key
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
